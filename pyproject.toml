[project]
name = "agenix-manager"
version = "0.1.0"
description = "NixOS module + TUI CLI for declarative agenix secret management"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cairnstew", email = "cairnstew@example.com" }]
keywords = ["nixos", "agenix", "secrets", "age", "encryption"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "textual>=0.60",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
agenix-manager = "agenix_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0", "mypy>=1.0", "textual-dev>=0.60"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0", "mypy>=1.0", "textual-dev>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]

[tool.uv.sources]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agenix_manager"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: tests that take >30s",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
