name: VM Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: Timeout in minutes per scenario
        required: false
        default: 15
        type: number

env:
  SCENARIOS: '["basic", "multi-secret", "custom-perms", "user-keys"]'

jobs:
  vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes || 15 }}
    strategy:
      matrix:
        test: ${{ fromJSON(env.SCENARIOS) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run VM test (${{ matrix.test }})
        run: nix build '.#vmTests.x86_64-linux.${{ matrix.test }}' -L
