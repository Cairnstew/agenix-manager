name: VM Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: Timeout in minutes per scenario
        required: false
        default: 15
        type: number

jobs:
  vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        test: [basic, multi-secret, custom-perms, user-keys]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Run VM test (${{ matrix.test }})
        run: nix build '.#vmTests.x86_64-linux.${{ matrix.test }}' -L
