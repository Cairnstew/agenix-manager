name: Release

on:
  push:
    tags: ["v*"]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_cli: ${{ steps.cli.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: cli
        run: |
          has_cli=false
          if grep -q '^\[project\.scripts\]' pyproject.toml 2>/dev/null; then
            has_cli=true
          fi
          echo "value=$has_cli" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - run: nix build .#default

      - uses: actions/upload-artifact@v4
        with:
          name: agenix-manager
          path: result

  publish-pypi:
    needs: [detect, build]
    if: needs.detect.outputs.has_cli == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agenix-manager
          path: dist

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build and publish
        run: |
          nix develop .#bootstrap --command uv build
          nix develop .#bootstrap --command uv publish

  github-release:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agenix-manager
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
